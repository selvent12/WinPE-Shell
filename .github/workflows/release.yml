# Release: on a version tag (v0.1.0, ...) the same build.ps1 runs on a GitHub Windows runner and a GitHub release is
# created with WinPE-Shell-<tag>-x64.zip (shell, UI utility, WinPE helpers, scripts) and build-sha256.csv.
# These are MSVC builds: their hashes differ from local builds (not bit-for-bit reproducible across machines).
name: release
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = "WinPE-Shell-$tag-x64"
          New-Item -ItemType Directory -Force "pkg\$pkg\winpe" | Out-Null
          Copy-Item out\shell\WinPE-Shell.exe, out\ui\WinPE-ShellUI.exe "pkg\$pkg\"
          Copy-Item out\winpe\WinPE-ShellStart.exe, out\winpe\DisplayLayout.dll, out\winpe\*.ps1 "pkg\$pkg\winpe\"
          Copy-Item README.md, LICENSE "pkg\$pkg\"
          Copy-Item out\build-sha256.csv "pkg\$pkg\"
          Compress-Archive -Path "pkg\$pkg" -DestinationPath "$pkg.zip"
          (Get-FileHash "$pkg.zip").Hash + "  $pkg.zip" | Set-Content "$pkg.zip.sha256" -Encoding ascii
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "WinPE-Shell-$tag-x64.zip" "WinPE-Shell-$tag-x64.zip.sha256" out\build-sha256.csv `
            --title "WinPE-Shell $tag" --notes "Built by GitHub Actions from $tag (see README.md, section 3: MSVC builds are not bit-for-bit reproducible)."
